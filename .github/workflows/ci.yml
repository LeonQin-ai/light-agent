name: Go and Rust CI
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./control/cmd/light-agentd
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/Cargo.toml --workspace
      - run: cargo build --manifest-path rust/Cargo.toml --workspace --release
      - name: Build Docker Worker image
        run: docker build -f deploy/Dockerfile.worker -t light-agent/worker:ci .
